/* Phase 1: portrait-friendly board + persistent right information panel */
#app{max-width:720px;padding:8px}h1{font-size:clamp(13px,3.6vw,19px);overflow-wrap:anywhere;margin-bottom:7px}
.status{margin-bottom:6px;font-size:11px;padding:5px;gap:4px}.badge{padding:4px 6px}

.playArea{display:grid;grid-template-columns:minmax(0, 66fr) minmax(0, 34fr);gap:7px;align-items:start;margin-top:5px}
.boardColumn{min-width:0;display:flex;flex-direction:column;gap:5px}
.boardWrap{position:relative;width:100%;aspect-ratio:1;margin:0}
.boardColumn .kingZone{position:relative;top:auto;bottom:auto;left:auto;width:100%;height:auto;min-height:33px;z-index:4;pointer-events:auto}
.boardColumn .king{font-size:clamp(10px,2.8vw,14px);padding:5px 6px;text-align:center}
.boardColumn .kingZone.player{pointer-events:auto}
#infoPanel{min-width:0;border:1px solid #536071;border-radius:11px;background:#222832;overflow:hidden;display:flex;flex-direction:column;max-height:min(70vh,550px)}
.infoHeading{padding:8px 6px;font-size:clamp(11px,3vw,14px);font-weight:800;background:#343d4c;border-bottom:1px solid #596274}
.infoContent{padding:8px 7px;font-size:clamp(10px,2.8vw,13px);line-height:1.5;overflow-y:auto;overflow-wrap:anywhere;min-height:155px;white-space:normal}
.infoContent .infoName{font-weight:800;font-size:clamp(13px,3.5vw,17px);margin-bottom:5px;color:#ffe2a7}
.infoContent .useCardButton{width:100%;margin-top:12px;background:#3d9a73;cursor:pointer;touch-action:manipulation}.infoContent .infoLine{margin:5px 0}.infoContent .infoEffect{margin-top:8px;padding-top:7px;border-top:1px solid #505b6a}
.handTitle{margin:10px 0 5px}.hand{margin-bottom:2px}
.pname{font-size:clamp(13px,3.8vw,24px)}.pstats{font-size:clamp(6px,1.8vw,9px)}

@media(min-width:550px){.playArea{grid-template-columns:minmax(0, 66fr) minmax(0, 34fr);gap:14px}.infoContent{font-size:14px}.boardColumn .king{font-size:15px}}

/* Two-row king status: HP | king | graveyard, with mana below HP. */
.boardColumn .kingZone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto auto;column-gap:4px;row-gap:2px;align-items:center;min-height:52px;pointer-events:auto}
.boardColumn .kingZone .king{grid-column:2;grid-row:1;font-size:clamp(9px,2.6vw,14px);padding:6px 3px;white-space:nowrap;cursor:pointer;touch-action:manipulation;min-width:0}
.kingStat{font-size:clamp(9px,2.3vw,13px);white-space:nowrap;display:flex;align-items:center;gap:1px;justify-content:flex-start;min-width:0}
.kingZone .kingStat:not(.manaStat){grid-column:1;grid-row:1}
.kingZone .graveButton{grid-column:3;grid-row:1;justify-self:end}
.kingStat.manaStat{grid-column:1 / -1;grid-row:2;justify-content:flex-start;padding-left:1px}
.kingStat b{font-variant-numeric:tabular-nums}
@media(max-width:380px){.boardColumn .kingZone .king{font-size:10px;padding:5px 2px}.kingStat{font-size:9px;letter-spacing:-.3px}}

/* Fixed geometry: card labels must never resize the board or pieces. */
.board{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));min-width:0;min-height:0}
.cell{min-width:0;min-height:0;overflow:hidden;isolation:isolate}

.piece .buffTag{top:-9px;bottom:auto;left:50%;transform:translateX(-50%)}

/* Data-driven movement/attack diagrams. Keep all cells inside the narrow info panel. */
.rangeSection{margin-top:9px;padding-top:8px;border-top:1px solid #505b6a}
.rangeTitle{font-weight:800;font-size:12px;margin-bottom:4px}
.rangeGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:180px;gap:0;margin:0 auto 5px;direction:ltr}

.rangeCell.origin{color:#fff;font-size:clamp(10px,3vw,17px);font-weight:800}
.rangeGrid.movement .rangeCell.arrow{color:#70b7ff}
.rangeGrid.attack .rangeCell.arrow{color:#ff8585}
.rangeCell.pass{color:#9aa3b1;font-size:12px}
.rangeNote{font-size:10px;color:#b6bfcd;line-height:1.35}

/* Match the panel to the board plus both king status rows; scroll content independently. */
#infoPanel{height:var(--panel-height, 330px);max-height:var(--panel-height, 330px);min-height:0}
.infoContent{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:7px 6px}
.infoContent .infoLine{margin:3px 0}
.infoContent .infoEffect{margin-top:6px;padding-top:5px}
.rangePair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:7px;border-top:1px solid #505b6a;padding-top:6px}
.rangePair .rangeSection{min-width:0;margin:0;padding:0;border:0}
.rangePair .rangeTitle{font-size:clamp(9px,2.4vw,12px);margin-bottom:3px;white-space:nowrap}
.rangePair .rangeGrid{width:100%;max-width:100px;margin:0 auto 2px;gap:0}
.rangePair .rangeCell{font-size:clamp(8px,2vw,13px)}
.rangePair .rangeCell.origin{font-size:clamp(9px,2.4vw,14px)}
.rangePair .rangeNote{font-size:9px;line-height:1.25;margin-top:3px}
.graveButton{background:#25303e;color:#fff;border:1px solid #6b798a;border-radius:7px;padding:3px 5px;font-size:clamp(10px,2.7vw,13px);white-space:nowrap;cursor:pointer}.graveButton b{margin-left:2px}.graveButton:active{background:#46576c}
</style></head><body><div id="app"><h1>5x5 Card Battle — phase2_king_awaken.html</h1><div class="status"><span class="badge">ターン: <b id="turn">1</b></span><span class="badge">自分山札: <b id="deck">35</b></span><span class="badge">決戦: <b id="battleTurns">なし</b></span><span class="badge">相手手札: <b id="cpuHand">5</b>枚</span></div><div id="message" role="status">カードを選んで召喚してください。</div><div class="playArea"><div class="boardColumn"><div class="kingZone enemy"><span class="kingStat">❤️HP<b id="cHp">20</b></span><button class="graveButton" type="button" onclick="showGraveyard('c')">🪦<b id="cGrave">0</b></button><div class="king" onclick="clickKing('c')">相手の王</div><span class="kingStat manaStat">💧マナ<b id="cpuMana">2/2</b></span></div><div class="boardWrap"><div id="board" class="board"></div></div><div class="kingZone player"><span class="kingStat">❤️HP<b id="pHp">20</b></span><button class="graveButton" type="button" onclick="showGraveyard('p')">🪦<b id="pGrave">0</b></button><div class="king" onclick="clickKing('p')">あなたの王</div><span class="kingStat manaStat">💧マナ<b id="mana">1/1</b></span></div></div><aside id="infoPanel" aria-live="polite"><div class="infoHeading">選択中の情報</div><div id="infoContent" class="infoContent">カードや駒、マスをタップすると情報を表示します。</div></aside></div><div class="handTitle">手札（タップして使用）</div><div id="hand" class="hand"></div><div class="controls"><button id="endTurn">ターン終了</button><button id="newGame" class="secondary">最初から</button></div><div id="log"></div></div><div id="overlay"><div class="result"><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="location.reload()">もう一度プレイ</button></div></div>

// PHASE 2 / Step 1: カード定義の単一管理場所。

const EnchantmentZone={
  attach(cardId,owner,target,controller=owner){

    if(card.cardId==='バーサーク'&&card.target.ref)card.target.ref.berserk=0;
    if(card.cardId==='マイン'&&S.mines[card.target.k]?.card===card)S.mines[card.target.k]=null;

  attachedToKing(side){return S.enchantments.filter(card=>card.zone==='attached'&&card.target.kind==='king'&&card.target.side===side)},
  onTurnEnd(side){

  },

  onTurnStart(side){

  }

function rangeDiagram(p,action){
 const offsets=pattern(p,action), active=new Map(), through=new Set();
 for(const [dr,dc] of offsets){
  active.set(`${dr},${dc}`,RANGE_ARROWS[`${dr},${dc}`]||'●');
  const steps=Math.max(Math.abs(dr),Math.abs(dc));
  if(steps>1){for(let i=1;i<steps;i++){
   const r=dr*i/steps,c=dc*i/steps;
   if(Number.isInteger(r)&&Number.isInteger(c))through.add(`${r},${c}`);
  }}
 }

 const kind=action==='move'?'movement':'attack';
 let cells='';
 for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++){
  const key=`${r},${c}`;
  const origin=r===0&&c===0;
  const arrow=active.get(key);
  const pass=!arrow&&through.has(key);
  cells+=`<span class="rangeCell ${origin?'origin':arrow?'arrow':pass?'pass':''}">${origin?'◯':arrow|| (pass?'・':'')}</span>`;
 }

const GameEvents={
  listeners:new Map(),
  on(type,listener){
    if(!this.listeners.has(type))this.listeners.set(type,new Set());
    this.listeners.get(type).add(listener);
    return ()=>this.listeners.get(type)?.delete(listener);
  },
  emit(type,detail={}){

// 現行カードの挙動を変えないため、能力定義は未登録。将来の能力は register で追加する。
const EffectEngine={
  handlers:new Map(),queue:[],resolving:false,maxEventsPerResolution:256,
  register(eventType,abilityId,condition,resolve){
    if(typeof condition!=="function"||typeof resolve!=="function")throw Error("能力の条件と処理が必要です");
    const entry={abilityId,condition,resolve};
    if(!this.handlers.has(eventType))this.handlers.set(eventType,[]);
    this.handlers.get(eventType).push(entry);
    return ()=>{const list=this.handlers.get(eventType);const i=list?.indexOf(entry)??-1;if(i>=0)list.splice(i,1)};
  },
  enqueue(event){
    // 発動中に起きたイベントは再帰呼び出しせず、発生順にキューへ積む。
    this.queue.push(event);
    if(this.resolving)return;
    this.resolving=true;
    let processed=0;
    try{
      while(this.queue.length){
        if(++processed>this.maxEventsPerResolution){
          this.queue.length=0;
          throw Error("効果イベントが連鎖上限を超えました。無限連鎖の可能性があります。");
        }
        const next=this.queue.shift();
        for(const ability of [...(this.handlers.get(next.type)||[])]){
          if(ability.condition(next))ability.resolve(next);
        }
      }
    }catch(error){
      this.queue.length=0;
      console.error("EffectEngine:",error);
      // 効果の失敗を黙って成功扱いしない。実カード導入時には画面にも通知する。
      throw error;
    }finally{this.resolving=false;}
  }

  event=>!S.gameOver&&event.detail.target?.side!==event.detail.attacker?.side&&
    CARD_DEFINITIONS[event.detail.target?.type]?.abilities?.includes("salamander_counter"),
  event=>{
    const {attacker,target,from}=event.detail;
    // 攻撃を受けた時点で成立する能力。倒された場合も反撃する。
    const attackerCell=S.board.indexOf(attacker);
    if(attackerCell<0)return;
    const result=GameCore.damageCreature(attackerCell,3);
    log(`${target.side==="p"?"あなたの":"CPUの"}サラマンダーの能力：${attacker.type}に3ダメージ。`);

const GameCore={
  createCreature(cardId,side){
    const d=CARD_DEFINITIONS[cardId];
    if(!d||d.type!=="creature")throw Error("不正なクリーチャー: "+cardId);
    return {type:cardId,atk:d.atk,hp:d.hp,owner:side,side,m:false,a:false,attacksUsed:0};
  },
  summon(cardId,side,k){
    if(S.board[k])return null;
    const piece=this.createCreature(cardId,side);
    S.board[k]=piece;
    GameEvents.emit("creature:summoned",{piece,side,cell:k});
    return piece;
  },
  move(from,to){
    const piece=S.board[from];
    if(!piece||S.board[to]||!rel(piece,from).includes(to))return null;
    S.board[to]=piece;S.board[from]=null;piece.m=true;
    GameEvents.emit("creature:moved",{piece,from,to});
    return piece;
  },
  damageCreature(k,amount){
    const piece=S.board[k];
    if(!piece)return null;
    piece.hp-=amount;
    GameEvents.emit("creature:damaged",{piece,cell:k,amount});
    const defeated=piece.hp<=0;
    if(defeated){EnchantmentZone.onCreatureDefeated(piece);S.board[k]=null;sendToGraveyard(piece.type,piece.owner||piece.side);GameEvents.emit("creature:defeated",{piece,cell:k});}
    return {piece,defeated,amount};
  },
  damageKing(side,amount){
    const key=side==="p"?"pHp":"cHp";
    S[key]-=amount;
    GameEvents.emit("king:damaged",{side,amount,hp:S[key]});
    return S[key]<=0;
  },
  attackCreature(from,to){
    const attacker=S.board[from],target=S.board[to];
    if(!attacker||!target||!atk(attacker,from).includes(to))return null;
    const amount=power(attacker);
    spendAttack(attacker);
    GameEvents.emit("creature:attacked",{attacker,target,from,to,amount});
    const result=this.damageCreature(to,amount);
    GameEvents.emit("creature:attack-resolved",{attacker,target,from,to,amount,defeated:result.defeated});
    return result;
  },
  attackKing(from){
    const attacker=S.board[from];
    if(!attacker||!kingAtk(attacker,from))return null;
    const amount=power(attacker),side=attacker.side==="p"?"c":"p";
    spendAttack(attacker);
    GameEvents.emit("creature:attacked",{attacker,targetKind:"king",from,side,amount});
    const defeated=this.damageKing(side,amount);
    GameEvents.emit("creature:attack-resolved",{attacker,targetKind:"king",from,side,amount,defeated});
    return {amount,side,defeated};
  }
};

    S.mana-=2;S.cHand.splice(idx,1);sendToGraveyard("ファイアーボルト","c");
    if(target&&S.board[target.i]===target.p){GameCore.damageCreature(target.i,2);log(`CPUがファイアーボルトで${target.p.type}に2ダメージ。`);if(target.p.hp<=0){log(`${target.p.type}を撃破。`)}msg(`CPU：${target.p.type}に2ダメージ！`);render();flashHit(target.i)}
    else{GameCore.damageKing("p",2);log("CPUがファイアーボルトであなたの王に2ダメージ。");msg("CPU：王に2ダメージ！");render();}
    await cpuWait();if(S.pHp<=0){lose("あなたの王が倒されました");return}
  }
  if(S.gameOver)return;
  // 移動可能な駒を選び、移動範囲を見せてから移動する。
  const movers=S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="c"&&!x.p.m&&rel(x.p,x.i).length);
  if(movers.length){
    const x=movers[Math.floor(Math.random()*movers.length)];
    S.cpuPreview={from:x.i,kind:"move"};msg(`CPU：${x.p.type}の移動範囲`);render();await cpuWait();
    const choices=rel(x.p,x.i);
    S.cpuPreview=null;
    if(choices.length){const k=choices[Math.floor(Math.random()*choices.length)];GameCore.move(x.i,k);log(`CPUの${x.p.type}が移動。`);msg(`CPU：${x.p.type}を移動`);render();enterSquare(k,x.p);offerPromotion(x.p,k);await cpuWait()}
  }
  if(S.gameOver)return;
  for(let attackRound=0;attackRound<2&&!S.gameOver;attackRound++){
  // 王への攻撃を優先し、次に相手クリーチャーを攻撃する。
  const ps=S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="c"&&canAttack(x.p));
  let x=ps.find(x=>kingAtk(x.p,x.i));
  let target=null;
  if(!x){for(const candidate of ps){const targets=atk(candidate.p,candidate.i).filter(k=>S.board[k]?.side==="p");if(targets.length){x=candidate;target=targets[0];break}}}
  if(x){
    S.cpuPreview={from:x.i,kind:"attack"};msg(`CPU：${x.p.type}の攻撃範囲`);render();await cpuWait();
    S.cpuPreview=null;
    if(target===null){GameCore.attackKing(x.i);log(`CPUの${x.p.type}が王を攻撃（-${power(x.p)}）。`);msg(`CPU：王に${power(x.p)}ダメージ！`);render();}
    else {const q=S.board[target];if(q?.side==="p"){GameCore.attackCreature(x.i,target);log(`CPUの${x.p.type}が${q.type}を攻撃（-${power(x.p)}）。`);if(q.hp<=0){log(`${q.type}を撃破。`)}msg(`CPU：${q.type}に${x.p.atk}ダメージ！`);render();flashHit(target)}}
    if(S.gameOver)return;
    await cpuWait();
  }
  }
  if(S.pHp<=0)return lose("あなたの王が倒されました");
  if(S.gameOver)return;
  tickBerserk("c");tickBoardEffects();S.cpuPreview=null;GameEvents.emit("turn:ended",{side:"c"});EnchantmentZone.onTurnEnd("c");S.side="p";S.turn++;S.kingAction.p={};EnchantmentZone.onTurnStart("p");GameEvents.emit("turn:started",{side:"p"});if(S.gameOver)return;S.maxMana=maxManaFor("p");S.mana=S.maxMana;reset();
  if(!draw("p"))return;
  log("あなたのターン。");msg("あなたのターンです。");render();
}
function win(reason="相手の王HPが0になりました。"){S.gameOver=true;render();$("resultTitle").textContent="勝利！";$("resultText").textContent=reason;$("overlay").classList.add("show")}
function lose(x){S.gameOver=true;render();$("resultTitle").textContent="敗北";$("resultText").textContent=x;$("overlay").classList.add("show")}
$("endTurn").onclick=endTurn;$("newGame").onclick=()=>location.reload();S.deck=deck();S.cDeck=deck();for(let i=0;i<5;i++){draw("p");draw("c")}log("ゲーム開始。初期手札5枚。");render();

function syncInfoPanelHeight(){
 const column=document.querySelector('.boardColumn'),panel=document.getElementById('infoPanel');
 if(column&&panel){const height=column.getBoundingClientRect().height;if(height>0)panel.style.setProperty('--panel-height',`${height}px`);}
}
if(typeof ResizeObserver!=='undefined'){
 const boardColumn=document.querySelector('.boardColumn');
 if(boardColumn)new ResizeObserver(syncInfoPanelHeight).observe(boardColumn);
}
window.addEventListener('resize',syncInfoPanelHeight);
window.addEventListener('orientationchange',syncInfoPanelHeight);
requestAnimationFrame(syncInfoPanelHeight);
</script></body></html>

/* Phase 1: portrait-friendly board + persistent right information panel */

/* Pseudo-3D board prototype: visual layer only. Game coordinates remain 5x5. */
.boardWrap{
  perspective:700px;
  perspective-origin:50% 100%;
  overflow:visible;
}
.board{
  transform-origin:50% 100%;
  transform:rotateX(42deg);
  transform-style:preserve-3d;
  box-shadow:0 13px 0 #80633a,0 18px 20px #0009;
  border-width:3px;
  will-change:transform;
}
.cell{
  transform-style:preserve-3d;
}
/* Keep pieces readable while the board itself recedes into perspective. */
.cell .piece{
  transform:rotateX(-42deg) translateZ(5px) scale(.88);
  transform-origin:center center;
}
.cell.cellEnchanted::after,
.cell.mineCell::before{
  transform:rotateX(-42deg) translateZ(7px);
  transform-origin:center center;
}
@media(max-width:600px){
  .boardWrap{perspective:560px;margin-top:-3%;margin-bottom:-7%}
  .board{transform:rotateX(40deg);box-shadow:0 9px 0 #80633a,0 14px 16px #0009}
  .cell .piece{transform:rotateX(-40deg) translateZ(4px) scale(.9)}
  .cell.cellEnchanted::after,.cell.mineCell::before{transform:rotateX(-40deg) translateZ(6px)}
}

// PHASE2 Step 4: イベント通知基盤。ルールを変更せず、将来のカード能力の発動点を統一する。
// 購読側は通知を受け取るだけ。効果の実行順・再帰制限は次の段階で設計する。
const GameEvents={
  listeners:new Map(),
  on(type,listener){
    if(!this.listeners.has(type))this.listeners.set(type,new Set());
    this.listeners.get(type).add(listener);
    return ()=>this.listeners.get(type)?.delete(listener);
  },
  emit(type,detail={}){
    const event={type,detail,turn:S.turn,activeSide:S.side};
    for(const listener of [...(this.listeners.get(type)||[])])listener(event);
    return event;
  }
};
// PHASE2 Step 5: イベントからカード能力へつなぐ効果エンジン。
// 現行カードの挙動を変えないため、能力定義は未登録。将来の能力は register で追加する。
const EffectEngine={
  handlers:new Map(),queue:[],resolving:false,maxEventsPerResolution:256,
  register(eventType,abilityId,condition,resolve){
    if(typeof condition!=="function"||typeof resolve!=="function")throw Error("能力の条件と処理が必要です");
    const entry={abilityId,condition,resolve};
    if(!this.handlers.has(eventType))this.handlers.set(eventType,[]);
    this.handlers.get(eventType).push(entry);
    return ()=>{const list=this.handlers.get(eventType);const i=list?.indexOf(entry)??-1;if(i>=0)list.splice(i,1)};
  },
  enqueue(event){
    // 発動中に起きたイベントは再帰呼び出しせず、発生順にキューへ積む。
    this.queue.push(event);
    if(this.resolving)return;
    this.resolving=true;
    let processed=0;
    try{
      while(this.queue.length){
        if(++processed>this.maxEventsPerResolution){
          this.queue.length=0;
          throw Error("効果イベントが連鎖上限を超えました。無限連鎖の可能性があります。");
        }
        const next=this.queue.shift();
        for(const ability of [...(this.handlers.get(next.type)||[])]){
          if(ability.condition(next))ability.resolve(next);
        }
      }
    }catch(error){
      this.queue.length=0;
      console.error("EffectEngine:",error);
      // 効果の失敗を黙って成功扱いしない。実カード導入時には画面にも通知する。
      throw error;
    }finally{this.resolving=false;}
  }
};

  GameEvents.on(eventType,event=>EffectEngine.enqueue(event));
}

// PHASE2 Step 2: 盤面の状態変更を画面・CPUから独立した共通操作へ集約。
// 操作は状態だけを変更し、render / log / アニメーションは呼び出し側が担当する。
const GameCore={
  createCreature(cardId,side){
    const d=CARD_DEFINITIONS[cardId];
    if(!d||d.type!=="creature")throw Error("不正なクリーチャー: "+cardId);
    return {type:cardId,atk:d.atk,hp:d.hp,owner:side,side,m:false,a:false,attacksUsed:0};
  },
  summon(cardId,side,k){
    if(S.board[k])return null;
    const piece=this.createCreature(cardId,side);
    S.board[k]=piece;
    GameEvents.emit("creature:summoned",{piece,side,cell:k});
    return piece;
  },
  move(from,to){
    const piece=S.board[from];
    if(!piece||S.board[to]||!rel(piece,from).includes(to))return null;
    S.board[to]=piece;S.board[from]=null;piece.m=true;
    GameEvents.emit("creature:moved",{piece,from,to});
    return piece;
  },
  damageCreature(k,amount){
    const piece=S.board[k];
    if(!piece)return null;
    const reduction=EnchantmentZone.attachedToCell(k).filter(card=>card.cardId==="防御結界").length;
    const dealt=Math.max(0,amount-reduction);
    piece.hp-=dealt;
    GameEvents.emit("creature:damaged",{piece,cell:k,amount:dealt,rawAmount:amount,reduction});
    const defeated=piece.hp<=0;
    if(defeated){EnchantmentZone.onCreatureDefeated(piece);S.board[k]=null;if(!CARD_DEFINITIONS[piece.type]?.token)sendToGraveyard(piece.type,piece.owner||piece.side);GameEvents.emit("creature:defeated",{piece,cell:k});}
    return {piece,defeated,amount:dealt,rawAmount:amount,reduction};
  },
  damageKing(side,amount){
    const key=side==="p"?"pHp":"cHp";
    if(S.gameOver)return S[key]<=0;
    S[key]=Math.max(0,S[key]-amount);
    const defeated=S[key]<=0;
    // 王へのあらゆるダメージはここで勝敗を確定する。発生元の判定漏れを防ぐ。
    if(defeated){
      if(side==="p")lose("あなたの王のHPが0になりました");
      else win("相手の王のHPが0になりました");
    }
    GameEvents.emit("king:damaged",{side,amount,hp:S[key]});
    return defeated;
  },
  attackCreature(from,to){
    const attacker=S.board[from],target=S.board[to];
    if(!attacker||!target||!atk(attacker,from).includes(to))return null;
    const amount=power(attacker);
    spendAttack(attacker);
    GameEvents.emit("creature:attacked",{attacker,target,from,to,amount});
    const result=this.damageCreature(to,amount);
    GameEvents.emit("creature:attack-resolved",{attacker,target,from,to,amount,defeated:result.defeated});
    return result;
  },
  attackKing(from){

    S.cpuPreview=null;if(!consumeBoardCard("c",ci,"バーサーク","enchant"))break;EnchantmentZone.cast("バーサーク","c",{kind:"creature",ref:target.p});
    log(`CPUが${target.p.type}にバーサークを使用。`);render();await cpuWait();
  }
  // CPUの補助スペル。行動を0.7秒ずつ見せる。
  if(!spellsBlocked("c")){
  while(!S.gameOver){
    const mi=S.cHand.indexOf("マナ"),hi=S.cHand.indexOf("ホープ");
    if(mi>=0&&S.mana>=2&&S.maxMana<10){
      msg("CPU：マナを使用");render();await cpuWait();
      if(!consumeSpellCard("c",mi,"マナ"))break;const {before:old}=BasicSpellEffects.mana("c");
      log(`CPUがマナを使用。最大マナ ${old}→${S.maxMana}。`);render();await cpuWait();continue;
    }
    if(hi>=0&&S.mana>=1){
      msg("CPU：ホープを使用（CPUが2枚引く）");render();await cpuWait();
      if(!consumeSpellCard("c",hi,"ホープ"))break;log("CPUがホープを使用。CPUが2枚引く。");
      if(BasicSpellEffects.hope("c")<2)return
      render();await cpuWait();continue;
    }
    break;
  }
  if(S.gameOver)return;
  } // 封魔中は補助スペルを使わない
  // CPUは使えるファイアーボルトを1枚ずつ使用。王を優先して狙う。
  while(!S.gameOver&&!spellsBlocked("c")&&S.mana>=SPELL.ファイアーボルト.cost){
    const idx=S.cHand.indexOf("ファイアーボルト");if(idx<0)break;
    const enemy=S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="p");
    const target=enemy.length&&S.pHp>2?enemy[Math.floor(Math.random()*enemy.length)]:null;
    msg(`CPU：ファイアーボルトの対象を選択`);render();await cpuWait();
    if(!consumeSpellCard("c",idx,"ファイアーボルト"))break;
    if(target&&S.board[target.i]===target.p){BasicSpellEffects.firebolt({kind:"piece",k:target.i});log(`CPUがファイアーボルトで${target.p.type}に2ダメージ。`);if(target.p.hp<=0){log(`${target.p.type}を撃破。`)}msg(`CPU：${target.p.type}に2ダメージ！`);render();flashHit(target.i)}
    else{BasicSpellEffects.firebolt({kind:"king",side:"p"});log("CPUがファイアーボルトであなたの王に2ダメージ。");msg("CPU：王に2ダメージ！");render();}
    await cpuWait();if(S.pHp<=0){lose("あなたの王が倒されました");return}
  }
  if(S.gameOver)return;
  // 移動可能な駒を選び、移動範囲を見せてから移動する。
  const movers=S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="c"&&!x.p.m&&rel(x.p,x.i).length);
  if(movers.length){
    const x=movers[Math.floor(Math.random()*movers.length)];
    S.cpuPreview={from:x.i,kind:"move"};msg(`CPU：${x.p.type}の移動範囲`);render();await cpuWait();
    const choices=rel(x.p,x.i);
    S.cpuPreview=null;
    if(choices.length){const k=choices[Math.floor(Math.random()*choices.length)];GameCore.move(x.i,k);log(`CPUの${x.p.type}が移動。`);msg(`CPU：${x.p.type}を移動`);render();enterSquare(k,x.p);offerPromotion(x.p,k);await cpuWait()}
  }
  if(S.gameOver)return;
  // ソーサラーの魔法は通常攻撃権を消費。CPUは敵クリーチャー、いなければ相手王を狙う。
  for(const x of S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="c"&&x.p.type==="ソーサラー"&&canAttack(x.p))){
    if(S.gameOver||S.mana<2||S.board[x.i]!==x.p)continue;
    const target=S.board.findIndex(p=>p?.side==="p");
    const result=resolveSorcererBolt("c",x.i,target>=0?{kind:"piece",k:target}:{kind:"king",side:"p"});
    if(!result)continue;
    if(result.kind==="piece"){
      log(`CPUのソーサラーの魔法：${result.victim.type}に2ダメージ。`);msg(`CPUのソーサラー：${result.victim.type}に2ダメージ！`);render();flashHit(target);
    }else{
      log("CPUのソーサラーの魔法：あなたの王に2ダメージ。");
      if(!S.gameOver){msg("CPUのソーサラー：王に2ダメージ！");render();}
    }
    if(S.gameOver)return;
    await cpuWait();
  }
  for(let attackRound=0;attackRound<2&&!S.gameOver;attackRound++){
  // 王への攻撃を優先し、次に相手クリーチャーを攻撃する。
  const ps=S.board.map((p,i)=>({p,i})).filter(x=>x.p?.side==="c"&&canAttack(x.p));
  let x=ps.find(x=>kingAtk(x.p,x.i));
  let target=null;
  if(!x){for(const candidate of ps){const targets=atk(candidate.p,candidate.i).filter(k=>S.board[k]?.side==="p");if(targets.length){x=candidate;target=targets[0];break}}}
  if(x){
    S.cpuPreview={from:x.i,kind:"attack"};msg(`CPU：${x.p.type}の攻撃範囲`);render();await cpuWait();
    S.cpuPreview=null;
    if(target===null){GameCore.attackKing(x.i);log(`CPUの${x.p.type}が王を攻撃（-${power(x.p)}）。`);msg(`CPU：王に${power(x.p)}ダメージ！`);render();}
    else {const q=S.board[target];if(q?.side==="p"){GameCore.attackCreature(x.i,target);log(`CPUの${x.p.type}が${q.type}を攻撃（-${power(x.p)}）。`);if(q.hp<=0){log(`${q.type}を撃破。`)}msg(`CPU：${q.type}に${x.p.atk}ダメージ！`);render();flashHit(target)}}
    if(S.gameOver)return;
    await cpuWait();
  }
  }
  if(S.pHp<=0)return lose("あなたの王が倒されました");
  if(S.gameOver)return;
  tickBerserk("c");tickBoardEffects();S.cpuPreview=null;GameEvents.emit("turn:ended",{side:"c"});EnchantmentZone.onTurnEnd("c");S.side="p";S.turn++;S.kingAction.p={};S.maxMana=maxManaFor("p");S.mana=S.maxMana;reset();EnchantmentZone.onTurnStart("p");GameEvents.emit("turn:started",{side:"p"});if(S.gameOver)return;
  if(!draw("p"))return;
  log("あなたのターン。");msg("あなたのターンです。");render();
}
function win(reason="相手の王HPが0になりました。"){if(S.gameOver)return;S.gameOver=true;render();$("resultTitle").textContent="勝利！";$("resultText").textContent=reason;$("overlay").classList.add("show")}
function lose(x){if(S.gameOver)return;S.gameOver=true;render();$("resultTitle").textContent="敗北";$("resultText").textContent=x;$("overlay").classList.add("show")}
$("endTurn").onclick=endTurn;$("newGame").onclick=()=>location.reload();S.deck=deck();S.cDeck=deck();for(let i=0;i<5;i++){draw("p");draw("c")}log("ゲーム開始。初期手札5枚。");render();

function syncInfoPanelHeight(){
 const column=document.querySelector('.boardColumn'),panel=document.getElementById('infoPanel');
 if(column&&panel){const height=column.getBoundingClientRect().height;if(height>0)panel.style.setProperty('--panel-height',`${height}px`);}
}
if(typeof ResizeObserver!=='undefined'){
 const boardColumn=document.querySelector('.boardColumn');
 if(boardColumn)new ResizeObserver(syncInfoPanelHeight).observe(boardColumn);
}
window.addEventListener('resize',syncInfoPanelHeight);
window.addEventListener('orientationchange',syncInfoPanelHeight);
requestAnimationFrame(syncInfoPanelHeight);
</script></body></html>
